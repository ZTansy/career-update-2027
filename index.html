<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Atlas 2027</title><style>body{font:15px system-ui,Arial;background:#f4f6fa;color:#172033;margin:0}main{max-width:1160px;margin:auto;padding:30px 18px}h1{font-size:29px;margin:0}p{color:#647085}input,select,button{font:inherit;padding:11px;border:1px solid #d8dfeb;border-radius:10px;background:white}input{flex:1;min-width:200px}button{cursor:pointer;background:#162b61;color:white}header,.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}section{background:white;border:1px solid #e5e9f1;border-radius:16px;padding:18px;margin-top:18px}.filters{margin:16px 0}.job{border-top:1px solid #edf0f5;padding:14px 2px}.job h3{margin:0 0 5px;font-size:17px}.meta{color:#637088;font-size:13px;margin-bottom:7px}.job a{color:#205cb2}.chip{display:inline-block;background:#eef3ff;color:#20458c;border-radius:6px;padding:3px 7px;font-size:12px;margin:4px 4px 4px 0}.small{font-size:12px}.note{background:#fff6dc;padding:12px;border-radius:10px}</style></head><body><main><header><div><h1>Career Atlas · 2027 求职雷达</h1><p>AI 产品 · AI 转型 · AI 培训赋能 · 用户研究 · 海外业务</p></div><button id="reload">更新页面数据</button></header><section><div class="note">职位从公开招聘接口同步。截止日期缺失时显示「未公布」，不猜测。当前仅检索已接入的数据源；不是全网搜索，也不代表每家重点目标公司均已覆盖。</div><div class="filters"><input id="query" placeholder="输入你的理想岗位描述，例如：负责企业 AI 转型、设计员工 AI 培训项目，中英双语、英国或中国"><select id="group"><option value="">全部方向</option><option value="ai-product">AI 产品</option><option value="ai-transform">AI 转型</option><option value="ai-training">AI 培训/赋能</option><option value="research">用户研究</option><option value="global">海外业务</option></select><select id="region"><option value="">所有地区</option><option value="中国">中国</option><option value="英国">英国</option><option value="欧洲">欧洲</option><option value="远程">远程</option></select><button id="search">查找匹配岗位</button></div><div class="small" id="status"></div></section><section><h2>匹配结果 <span id="count"></span></h2><div id="results">正在加载…</div></section></main><script>
let jobs=[],updated="";const $=id=>document.getElementById(id);
const groups={"ai-product":["ai product","product manager","产品经理","product strategy","agentic product","product management"],"ai-transform":["ai transformation","digital transformation","ai adoption","change management","transformation consultant","ai strategy","人工智能转型","数字化转型","企业ai","generative ai implementation"],"ai-training":["ai enablement","ai trainer","ai training","learning and development","learning & development","ai literacy","ai education","employee enablement","培训","企业赋能","learning specialist","learning experience"],"research":["user research","ux research","consumer insights","customer insight","体验研究","用户研究"],"global":["international","global growth","overseas","international business","cross-border","海外","出海","global marketing"]};
function score(j,q,g,r){let text=(j.title+" "+j.description+" "+j.location).toLowerCase(),title=j.title.toLowerCase(),s=0;if(g){const words=groups[g];s+=words.some(w=>title.includes(w))?40:words.some(w=>text.includes(w))?12:-15}if(q){const terms=q.toLowerCase().split(/[\s,，、;；。]+/).filter(x=>x.length>1);for(const word of terms){if(title.includes(word))s+=18;else if(text.includes(word))s+=6} }if(r){const loc=j.location.toLowerCase();const regions={"中国":["china","shanghai","beijing","shenzhen","中国","上海","北京","香港"],"英国":["united kingdom","london","uk","英国","伦敦","cambridge","reading"],"欧洲":["germany","france","netherlands","ireland","berlin","paris","dublin","amsterdam","europe"],"远程":["remote","远程"]};s+=(regions[r]||[]).some(w=>loc.includes(w))?25:-20}return s}
function render(){let q=$("query").value.trim(),g=$("group").value,r=$("region").value;let result=jobs.filter(x=>x.active!==false).map(j=>({...j,match:score(j,q,g,r)})).filter(j=>!(q||g||r)||j.match>0).sort((a,b)=>b.match-a.match);$("count").textContent="("+result.length+")";$("results").innerHTML="";for(let j of result.slice(0,150)){let box=document.createElement("div");box.className="job";let h=document.createElement("h3");h.textContent=j.title;box.appendChild(h);let meta=document.createElement("div");meta.className="meta";meta.textContent=j.company+" · "+(j.location||"地点未公布")+" · 匹配分 "+j.match;box.appendChild(meta);let d=document.createElement("div");d.className="small";d.textContent="截止日期："+(j.deadline||"未公布")+" · 来源："+j.source+" · 首次发现："+j.first_seen.slice(0,10);box.appendChild(d);let p=document.createElement("p");p.textContent=(j.description||"无 JD 文本").slice(0,350);box.appendChild(p);let a=document.createElement("a");a.href=j.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="查看官方申请与完整岗位要求 ↗";box.appendChild(a);$("results").appendChild(box)}if(!result.length)$("results").textContent="当前已连接的数据源中未找到匹配岗位。可换关键词，或添加更多真实招聘源。";}
async function load(){try{$("status").textContent="读取职位数据中…";const r=await fetch("./jobs-feed.json?t="+Date.now());if(!r.ok)throw new Error("职位数据尚未生成");const data=await r.json();jobs=data.jobs||[];updated=data.updated_at||"";$("status").textContent="更新："+(updated||"尚无")+" · 数据量："+jobs.length+" · 采集源错误："+(data.errors||[]).length;render()}catch(e){$("status").textContent="暂无同步结果："+e.message+"。请先运行 GitHub Actions 中的更新招聘数据任务。";$("results").textContent="数据尚未生成。";}}
$("search").onclick=render;$("reload").onclick=load;load();</script></body></html>
